name: CI

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mock-swagger:
        image: stoplight/prism:3
        ports:
          - 8080:4010
        command: mock -h 0.0.0.0 https://raw.githubusercontent.com/SamuelMarks/cdd-openapi-test-harness/master/petstore.json
      mock-openapi:
        image: stoplight/prism:3
        ports:
          - 8081:4010
        command: mock -h 0.0.0.0 https://raw.githubusercontent.com/SamuelMarks/cdd-openapi-test-harness/master/petstore_oas3.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout OpenAPI Test Harness
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/cdd-openapi-test-harness
          path: cdd-openapi-test-harness

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Format Check
        run: ./gradlew spotlessCheck --stacktrace

      - name: Build
        run: ./gradlew assemble --stacktrace

      - name: Run Tests
        run: ./gradlew allTests --stacktrace

      - name: Lint and Verify
        run: ./gradlew check --stacktrace

      - name: Swagger 2.0 Petstore test
        run: ./cdd.sh to_sdk -i ./cdd-openapi-test-harness/petstore.json

      - name: OpenAPI 3.2.0 Petstore test
        run: ./cdd.sh to_sdk -i ./cdd-openapi-test-harness/petstore_oas3.json

      - name: Swagger 2.0 Server and Client test
        run: python3 scripts/test_server_and_client.py ./cdd-openapi-test-harness/petstore.json

      - name: OpenAPI 3.2.0 Server and Client test
        run: python3 scripts/test_server_and_client.py ./cdd-openapi-test-harness/petstore_oas3.json

      - name: Build WASM
        run: make build_wasm

      - name: Release WASM Artifact
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          gh release create "$TAG_NAME" bin/*.wasm --title "$TAG_NAME" --generate-notes || gh release upload "$TAG_NAME" bin/*.wasm --clobber

